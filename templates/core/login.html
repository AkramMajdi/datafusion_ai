<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Data Fusion AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .brand {
            color: #1F3864;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }
        .brand-sub {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }
        .btn-primary {
            background: #1F3864;
            border-color: #1F3864;
        }
        .btn-primary:hover {
            background: #162a4a;
            border-color: #162a4a;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">Data Fusion AI</div>
    <div class="brand-sub">Jordan University of Science and Technology</div>

    {% if form.errors %}
        <div class="alert alert-danger">
            Invalid username or password. Please try again.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control form-control-lg"
                   placeholder="Enter username" autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control form-control-lg"
                   placeholder="Enter password">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100 btn-lg">
            Sign In
        </button>
    </form>
</div>
</body>
</html>
